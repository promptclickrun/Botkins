# Runs when a release is published, and by hand for one version.
#
# Every copy of Botkins takes its update from the latest release. This workflow checks that the
# release has every file each of them needs (desktop/scripts/check-release.mjs). The same check
# is run on the draft before it is published; this run is the alarm if that was skipped.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: The version to check, for example 0.17.0
        required: true

permissions:
  contents: read

jobs:
  check:
    name: The release is whole
    # No copy of Botkins updates to a prerelease, so one is not checked.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the release's files, checksums and signature
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: node scripts/check-release.mjs "$VERSION"
