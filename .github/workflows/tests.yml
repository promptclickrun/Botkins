# Runs each component's own tests on every pull request and on main.
#
# The desktop app and the terminal host are one codebase (desktop/), and the desktop suite
# holds the terminal host's tests too. It runs on Linux and on macOS because the terminal
# host is installed on both. A change that breaks one of them fails here before it merges.
#
# The "Docker image" job builds the terminal host's Docker image and starts it, so a change that
# breaks the image fails here and not on the day of a release.
#
# The last job builds the two containers of the Docker host with a screen (`host` and `workspace`,
# the Compose profile "display"), starts them, and uses them as an owner's phone and a team
# member's phone do (desktop/test/display-e2e). No other check starts those two containers.
#
# No job uses a secret, so a pull request from a fork runs the same checks.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop and terminal host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Two of the host's tests run the self-hosted relay (mobile/relay/node), which has its own packages.
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: mobile/relay
      # Type-checks the window's code and bundles it.
      - run: npm run build
      - run: npm test
      # What the terminal host does as root beside a folder that is not root's own (its update job
      # and its service install). `npm test` skips these tests, because they need root to give
      # rights up and to plant links another user could not write through.
      - name: The tests that need root
        run: |
          if [ -f test/terminal-root.test.mjs ]; then
            sudo env "PATH=$PATH" node --test test/terminal-root.test.mjs
          else
            echo "This branch has no test/terminal-root.test.mjs yet."
          fi

  mobile:
    name: Phone app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/relay/package-lock.json
      - run: npm ci
      # The tests start `wrangler dev` on the runner. It needs no account and no network.
      - run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The image a release publishes (.github/workflows/release.yml), built for this machine only.
      - uses: docker/build-push-action@v7
        with:
          context: desktop
          target: terminal
          load: true
          tags: botkins:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image serves, and reports this version
        run: sh .github/scripts/check-image.sh botkins:check "$(jq -r .version desktop/package.json)"

  display:
    name: Docker host with a screen (two containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The stand-in phones are Node programs. They need no packages.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      # This job builds the two images itself, with the runner's layer cache, and the check then
      # starts them with --no-build. So it must build what Compose would. When the Compose file
      # starts to build a service another way, this step fails and says so.
      - name: The job builds what Compose builds
        working-directory: desktop
        run: |
          expected='{"host":{"dockerfile":"Dockerfile","target":"host","args":null},"workspace":{"dockerfile":"Dockerfile","target":"workspace","args":null},"images":[null,null]}'
          found=$(docker compose -p botkins-display-e2e --profile display config --format json |
            jq -c '.services | {host: (.host.build | {dockerfile, target, args}), workspace: (.workspace.build | {dockerfile, target, args}), images: [.host.image, .workspace.image]}')
          if [ "$found" != "$expected" ]; then
            echo "desktop/docker-compose.yml builds the host or the workspace another way than this job does:" >&2
            echo "  the file: $found" >&2
            echo "  this job: $expected" >&2
            echo "Change the two build steps of the job \"display\" in .github/workflows/tests.yml to match, and this line." >&2
            exit 1
          fi
      # The names are the ones Compose gives the images of the project botkins-display-e2e.
      - name: Build the host image
        uses: docker/build-push-action@v7
        with:
          context: desktop
          target: host
          load: true
          tags: botkins-display-e2e-host
          cache-from: type=gha,scope=display-host
          cache-to: type=gha,mode=max,scope=display-host
      - name: Build the workspace image
        uses: docker/build-push-action@v7
        with:
          context: desktop
          target: workspace
          load: true
          tags: botkins-display-e2e-workspace
          cache-from: type=gha,scope=display-workspace
          cache-to: type=gha,mode=max,scope=display-workspace
      - name: An owner's phone and a member's phone use the two containers
        run: sh desktop/test/display-e2e/run.sh --no-build
