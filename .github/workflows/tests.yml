# Runs each component's own tests on every pull request and on main.
#
# The desktop app and the terminal host are one codebase (desktop/), and the desktop suite
# holds the terminal host's tests too. It runs on Linux and on macOS because the terminal
# host is installed on both. A change that breaks one of them fails here before it merges.
#
# The "Docker image" job builds the terminal host's Docker image and starts it, so a change that
# breaks the image fails here and not on the day of a release.
#
# The last job builds the two containers of the Docker host with a screen (`host` and `workspace`,
# the Compose profile "display"), starts them, and uses them as an owner's phone and a team
# member's phone do (desktop/test/display-e2e). No other check starts those two containers.
#
# The "real runtime" job starts the model runtime that the app ships (the Copilot SDK's own
# program, from `npm ci`) with a scripted model on this machine, and checks what only that program
# decides: Botkins' permission question still comes when a skill's header or a plugin's hook asks
# for a tool with no question, a command that a hook changed is the one that is asked about and
# the one that runs, and a plugin's hook cannot keep a turn going without end. A new version of
# the SDK that changes one of these fails here. It needs no account, no token and no network.
#
# The "terminal host on macOS" job installs this checkout as a launchd job in the runner's own
# session, with the host key in its login keychain, and uses it from start to end
# (desktop/test/terminal-e2e/macos.sh): a stand-in provider signs in, a bot answers, a stand-in
# phone pairs on the local network, and the service is restarted, killed, stopped and refreshed.
# Then it packages the checkout as a release's own macOS file, installs that, and has the service
# update itself between versions (desktop/test/terminal-e2e/macos-update.sh).
# On Linux the release itself is installed and updated (release.yml); on macOS this was a run by
# hand on one computer.
#
# The "window's smokes" job starts the built desktop app with Electron and uses its window, one
# smoke after the other (desktop/test/*-smoke.mjs, run by desktop/test/run-smokes.mjs). It runs on
# macOS, in two parts side by side. Before it, the smokes ran only by hand on one computer, and a
# change could break one with every check green.
#
# No job uses a secret, so a pull request from a fork runs the same checks.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop and terminal host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Two of the host's tests run the self-hosted relay (mobile/relay/node), which has its own packages.
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: mobile/relay
      # Type-checks the window's code and bundles it.
      - run: npm run build
      - run: npm test
      # What the terminal host does as root beside a folder that is not root's own (its update job
      # and its service install). `npm test` skips these tests, because they need root to give
      # rights up and to plant links another user could not write through.
      - name: The tests that need root
        run: |
          if [ -f test/terminal-root.test.mjs ]; then
            sudo env "PATH=$PATH" node --test test/terminal-root.test.mjs
          else
            echo "This branch has no test/terminal-root.test.mjs yet."
          fi

  mobile:
    name: Phone app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/relay/package-lock.json
      - run: npm ci
      # The tests start `wrangler dev` on the runner. It needs no account and no network.
      - run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The image a release publishes (.github/workflows/release.yml), built for this machine only.
      - uses: docker/build-push-action@v7
        with:
          context: desktop
          target: terminal
          load: true
          tags: botkins:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image serves, and reports this version
        run: sh .github/scripts/check-image.sh botkins:check "$(jq -r .version desktop/package.json)"

  display:
    name: Docker host with a screen (two containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The stand-in phones are Node programs. They need no packages.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      # This job builds the two images itself, with the runner's layer cache, and the check then
      # starts them with --no-build. So it must build what Compose would. When the Compose file
      # starts to build a service another way, this step fails and says so.
      - name: The job builds what Compose builds
        working-directory: desktop
        run: |
          expected='{"host":{"dockerfile":"Dockerfile","target":"host","args":null},"workspace":{"dockerfile":"Dockerfile","target":"workspace","args":null},"images":[null,null]}'
          found=$(docker compose -p botkins-display-e2e --profile display config --format json |
            jq -c '.services | {host: (.host.build | {dockerfile, target, args}), workspace: (.workspace.build | {dockerfile, target, args}), images: [.host.image, .workspace.image]}')
          if [ "$found" != "$expected" ]; then
            echo "desktop/docker-compose.yml builds the host or the workspace another way than this job does:" >&2
            echo "  the file: $found" >&2
            echo "  this job: $expected" >&2
            echo "Change the two build steps of the job \"display\" in .github/workflows/tests.yml to match, and this line." >&2
            exit 1
          fi
      # The names are the ones Compose gives the images of the project botkins-display-e2e.
      - name: Build the host image
        uses: docker/build-push-action@v7
        with:
          context: desktop
          target: host
          load: true
          tags: botkins-display-e2e-host
          cache-from: type=gha,scope=display-host
          cache-to: type=gha,mode=max,scope=display-host
      - name: Build the workspace image
        uses: docker/build-push-action@v7
        with:
          context: desktop
          target: workspace
          load: true
          tags: botkins-display-e2e-workspace
          cache-from: type=gha,scope=display-workspace
          cache-to: type=gha,mode=max,scope=display-workspace
      - name: An owner's phone and a member's phone use the two containers
        run: sh desktop/test/display-e2e/run.sh --no-build

  runtime:
    name: The real runtime still asks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # The runtime is one of the packages that `npm ci` installs. The checks need no build.
      - run: npm ci
      # Each script ends with 0 only when every case holds, and its last line is PASSED or
      # FAILED with the cases (desktop/test/hook-changed-args-live.mjs and
      # desktop/test/skill-allowed-tools-live.mjs). The model is the script itself, on 127.0.0.1.
      - name: The permission question, a hook's changed command, and the limits
        run: npm run test:runtime

  terminal-macos:
    name: Terminal host on macOS, end to end
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # The script changes two things of the runner's user and puts both back: the launchd job
      # app.botkins.terminal and the keychain item "Botkins Terminal Host". Its last line is
      # MACOS END TO END: PASSED. It runs with --no-relay: a check on each pull request does not
      # take a place at the public relay. (The first run of this job was with the relay step,
      # and it passed; run the script by hand with no option for that step.)
      - name: Install as a launchd job, pair a stand-in phone, restart, kill, stop and refresh
        run: bash test/terminal-e2e/macos.sh --no-relay
      # The second script packages this checkout as the release's own file for this Mac, installs
      # that, and has the running service update itself two times through a mirror on this machine
      # with a key made for the run: once to a version with another job file, and once to a version
      # that does not stay up, which is put back. It needs GnuPG. Its watch on a new version is 30
      # seconds, and launchd on a busy machine can start a job late, so a failure gets one more
      # try, with a warning that says so. (Three of three runs passed on a runner, in about three
      # minutes each, before this step was added.)
      - name: GnuPG, from the runner's image or from Homebrew
        run: command -v gpg || brew install gnupg
      - name: An update between versions, from the packaged file, started from the running service
        run: |
          if ! bash test/terminal-e2e/macos-update.sh; then
            echo "::warning::The macOS update check failed once. It gets one more try, because launchd can start a job late on a busy machine."
            bash test/terminal-e2e/macos-update.sh
          fi

  smokes:
    name: The window's smokes (part ${{ matrix.part }} of 2)
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # `npm ci` also downloads Electron, which each smoke starts.
      - run: npm ci
      # A smoke starts the built window.
      - run: npm run build
      # Each smoke runs in a process of its own with a time limit, and the run goes on after a
      # failure. A smoke gets no sign-in, no keychain and no real model turn: the runner takes
      # those switches out of its environment. A smoke that this machine cannot do is in the
      # runner's own list (LEFT_OUT), with the reason, and its line says so.
      - name: Each smoke in its own process
        run: node test/run-smokes.mjs --part=${{ matrix.part }}/2 --logs="$RUNNER_TEMP/smokes"
      - name: Keep each smoke's whole output when one did not pass
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smokes-part-${{ matrix.part }}
          path: ${{ runner.temp }}/smokes
          retention-days: 7
          if-no-files-found: ignore
