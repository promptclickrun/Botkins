# The Azure one-click deployment, laid over ../../desktop/docker-compose.yml. The VM's
# `botkins` command runs both files with --project-directory desktop, so paths here are
# relative to desktop/.
#
# It runs one of two setups, by the profile the `botkins` command passes:
#   terminal  the terminal host (`botkins`): one small Node service, no display
#   display   Screen access (`host` and `workspace`): Botkins on a virtual display a phone can see
#
# Only Caddy listens on the internet (80 for the certificate check, 443). The relay sits behind
# it, and the Botkins host reaches the relay through Caddy by the same public name the phones
# use, without leaving the machine.

services:
  botkins:
    # In the base file this service has no profile and always runs. Here it runs only when
    # the deployment was made without Screen access.
    profiles: ["terminal"]
    environment:
      # Phones reach this server through its relay only. The relay and the server's name are
      # the terminal host's own settings: install.sh sets them with `botkins config set`.
      BOTKINS_PAIR_ADDRESS: ""
    # The link's port is not published: nothing reaches it from outside the container network.
    ports: !reset []
    depends_on: [caddy]
    # Each start waits for the relay to answer, so the host's first try at it succeeds (see the script).
    volumes:
      - ../deploy/azure/wait-for-relay.sh:/usr/local/bin/wait-for-relay:ro
    entrypoint: ["/usr/bin/tini", "--", "sh", "/usr/local/bin/wait-for-relay", "https://${BOTKINS_FQDN:?}/v1/health"]
    command: ["botkins", "serve"]

  host:
    environment:
      BOTKINS_RELAY_URL: "https://${BOTKINS_FQDN:?}"
      # Phones reach this server through its relay only. So the relay counts as the server's own:
      # a phone sets the screen's level through it, with the same ticket and Face ID signature
      # as on the server's own network (desktop/desktop/link/grant.mjs).
      BOTKINS_RELAY_OWN: "1"
      BOTKINS_PAIR_ADDRESS: ""
      BOTKINS_PAIR_TTL_MS: "${BOTKINS_PAIR_TTL_MS:-3600000}"
    depends_on: [caddy]
    # Each start waits for the relay to answer, so the host's first try at it succeeds (see the script).
    volumes:
      - ../deploy/azure/wait-for-relay.sh:/usr/local/bin/wait-for-relay:ro
    command: ["sh", "/usr/local/bin/wait-for-relay", "https://${BOTKINS_FQDN:?}/v1/health", "/usr/local/bin/botkins-headless-host"]

  workspace:
    # Model provider sign-ins given at deployment (CLAUDE_CODE_OAUTH_TOKEN, BOTKINS_COPILOT_TOKEN).
    env_file:
      - path: /etc/botkins/providers.env
        required: false

  relay:
    build:
      context: ../mobile
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    user: "10002:10002"
    environment:
      PORT: "8080"
      DATA_DIR: /var/lib/botkins-relay
      # Caddy sets this to the address it saw. Nothing else can reach the relay.
      CLIENT_IP_HEADER: x-real-ip
      PUSH_UPSTREAM: "${BOTKINS_PUSH_UPSTREAM:-https://relay.botkins.app}"
    volumes:
      - botkins-relay:/var/lib/botkins-relay
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    environment:
      BOTKINS_FQDN: "${BOTKINS_FQDN:?}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Written by install.sh from deploy/azure/Caddyfile.
      - /etc/botkins/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [relay]
    networks:
      default:
        # The Botkins host finds the relay at its public name here, so it needs no hairpin route.
        aliases:
          - "${BOTKINS_FQDN:?}"

volumes:
  botkins-relay:
  caddy-data:
  caddy-config:
