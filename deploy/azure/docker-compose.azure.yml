# The Azure one-click deployment, laid over ../../desktop/docker-compose.yml. The VM's
# `botkins` command runs both files with --project-directory desktop, so paths here are
# relative to desktop/.
#
# Only Caddy listens on the internet (80 for the certificate check, 443). The relay sits behind
# it, and the Botkins host reaches the relay through Caddy by the same public name the phones
# use, without leaving the machine.

services:
  host:
    environment:
      BOTKINS_RELAY_URL: "https://${BOTKINS_FQDN:?}"
      # Phones reach this server through its relay only.
      BOTKINS_PAIR_ADDRESS: ""
      BOTKINS_PAIR_TTL_MS: "${BOTKINS_PAIR_TTL_MS:-3600000}"
    depends_on: [caddy]

  workspace:
    # Model provider sign-ins given at deployment (CLAUDE_CODE_OAUTH_TOKEN, BOTKINS_COPILOT_TOKEN).
    env_file:
      - path: /etc/botkins/providers.env
        required: false

  relay:
    build:
      context: ../mobile
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    user: "10002:10002"
    environment:
      PORT: "8080"
      DATA_DIR: /var/lib/botkins-relay
      # Caddy sets this to the address it saw. Nothing else can reach the relay.
      CLIENT_IP_HEADER: x-real-ip
      PUSH_UPSTREAM: "${BOTKINS_PUSH_UPSTREAM:-https://relay.botkins.app}"
    volumes:
      - botkins-relay:/var/lib/botkins-relay
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    environment:
      BOTKINS_FQDN: "${BOTKINS_FQDN:?}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Written by install.sh from deploy/azure/Caddyfile.
      - /etc/botkins/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [relay]
    networks:
      default:
        # The host container finds the relay at its public name here, so it needs no hairpin route.
        aliases:
          - "${BOTKINS_FQDN:?}"

volumes:
  botkins-relay:
  caddy-data:
  caddy-config:
