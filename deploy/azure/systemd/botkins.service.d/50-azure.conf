# Added to the unit that `botkins service install` writes. Updates keep it.
[Unit]
Wants=botkins-relay.service caddy.service
After=botkins-relay.service caddy.service

[Service]
# The host offers the newest relay protocol on its first try. If that try fails, it stays on the
# older protocol. On a new server the first try would come before Caddy has its certificate, so
# each start waits for the relay to answer over HTTPS. After 9 minutes it starts anyway.
ExecStartPre=/opt/botkins-server/src/deploy/azure/wait-for-relay.sh
TimeoutStartSec=11min
