# Screen access: the Botkins service shows the virtual display (botkins-display.service) to a paired phone.
[Unit]
Wants=botkins-display.service
After=botkins-display.service

[Service]
Environment=DISPLAY=:20
Environment=XAUTHORITY=/var/lib/botkins/display/Xauthority
# The service has its own /tmp. It gets the display's socket folder from the real one.
BindReadOnlyPaths=-/tmp/.X11-unix
