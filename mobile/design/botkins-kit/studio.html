<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Botkins Motion Studio</title><link rel="stylesheet" href="theme/botkins.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bk-canvas);color:var(--bk-ink);font:16px var(--bk-body)}main{max-width:930px;margin:auto;padding:32px 20px}h1,h2{font-family:var(--bk-display);margin:0 0 12px}h1{font-size:clamp(36px,6vw,65px);letter-spacing:-.06em}article{display:flex;flex-wrap:wrap;align-items:center;gap:26px;border-radius:24px;background:var(--bk-surface);padding:20px;margin-bottom:22px}#stage{width:min(100%,290px)}#stage svg{width:100%;height:auto}aside{flex:1;min-width:200px}label{display:inline-grid;gap:2px;margin:5px;font-size:14px}select,button{font:inherit;border-radius:12px;border:1px solid var(--bk-border);color:var(--bk-ink);background:var(--bk-surface);padding:9px}button{cursor:pointer;margin:3px}button[aria-pressed=true],#download{background:var(--bk-action);color:var(--bk-onAction)}h2{font-size:21px;margin-top:16px}small{display:block;margin:8px 0}</style><main><h1>Botkins motion studio</h1><article><div id="stage"></div><aside><label>Botkin<select id="head"></select></label><label>Colorway<select id="palette"></select></label><label>Eyes<select id="eyes"></select></label><label>Theme<select id="theme"><option>Light</option><option>Dark</option></select></label><p><label><span><input id="blink" type="checkbox" checked> Blink</span></label> <label><span><input id="still" type="checkbox"> Reduced motion</span></label></p><button id="download">Save SVG</button><button id="replay">Replay</button></aside></article><div id="states"></div></main><script src="avatars.js"></script><script src="customize.js"></script><script src="motion/catalog.js"></script><script src="motion/render.js"></script><script>
const el=id=>document.getElementById(id);
function opts(id,values){values.forEach(v=>el(id).add(new Option(v,v)))}
opts('head',Object.keys(heads));el('head').value='sprig';opts('palette',Object.keys(Botkins.palettes));opts('eyes',['State default',...Botkins.eyeStyles]);
let selected='Thinking',xml='';
function show(){document.documentElement.dataset.theme=el('theme').value.toLowerCase();xml=BotkinsMotion.render(heads[el('head').value],selected,{palette:el('palette').value,eyes:el('eyes').selectedIndex?el('eyes').value:undefined,blink:el('blink').checked,reducedMotion:el('still').checked});el('stage').innerHTML=xml;document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===selected))}
for(const [kind,label] of [['activity','Agent loop'],['outcome','Outcomes'],['reaction','Reactions']]){const h=document.createElement('h2');h.textContent=label;el('states').append(h);for(const [name,s] of Object.entries(BotkinsMotionCatalog.states)){if(s.kind!==kind)continue;const b=document.createElement('button');b.textContent=name;b.dataset.state=name;b.onclick=()=>{selected=name;show()};el('states').append(b)}}
document.querySelectorAll('input,select').forEach(c=>c.onchange=show);el('replay').onclick=show;el('download').onclick=()=>{const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=[el('head').value,selected,el('palette').value].join('-').toLowerCase()+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};show()
</script></html>
